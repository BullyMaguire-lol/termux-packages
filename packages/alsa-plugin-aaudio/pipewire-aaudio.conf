# Android's audio output (AAudio, through the ALSA plugin) as PipeWire's sink.
context.objects = [
    {   factory = adapter
        args = {
            factory.name     = api.alsa.pcm.sink
            node.name        = android_output
            node.description = "Android"
            media.class      = Audio/Sink
            api.alsa.path    = aaudio
            priority.session = 1000
            priority.driver  = 1000
        }
        flags = [ nofail ]
    }
]
