# From the pipewire-pulse package: a program using the PulseAudio library that
# finds no sound server starts PipeWire (with pipewire-pulse, its PulseAudio
# server) instead of pulseaudio, the way Termux starts pulseaudio. Remove the
# pipewire-pulse package to go back to pulseaudio.
autospawn = yes
daemon-binary = @TERMUX_PREFIX@/bin/pipewire-launcher
